<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual interativo</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f6f8fa;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#viewer {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  cursor: grab;
}
#viewer:active { cursor: grabbing; }
#diagram {
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
  user-select: none;
}
.controls {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  gap: 6px;
}
.controls button {
  border: 1px solid #687782;
  background: #ffffff;
  color: #1f2933;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
#error {
  display: none;
  padding: 1rem;
  color: #7a271a;
}
</style>
</head>
<body>
<div id="viewer">
  <div class="controls" aria-label="Controles do visual">
    <button type="button" id="zoom-in" aria-label="Ampliar">+</button>
    <button type="button" id="zoom-out" aria-label="Reduzir">−</button>
    <button type="button" id="reset">Restaurar</button>
  </div>
  <img id="diagram" alt="Visual metodológico interativo" draggable="false">
  <div id="error">Visual indisponível.</div>
</div>
<script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const requested = params.get("src") || "";
const alt = params.get("alt") || "Visual metodológico interativo";
const allowed = /^assets\/visuais\/V\d{2}\.svg$/;
const image = document.getElementById("diagram");
const error = document.getElementById("error");
const viewer = document.getElementById("viewer");

if (!allowed.test(requested)) {
  image.style.display = "none";
  error.style.display = "block";
} else {
  image.src = requested;
  image.alt = alt;
  const panzoom = Panzoom(image, {
    maxScale: 12,
    minScale: 0.5,
    step: 0.3
  });
  viewer.addEventListener("wheel", panzoom.zoomWithWheel, { passive: false });
  document.getElementById("zoom-in").addEventListener("click", () => panzoom.zoomIn());
  document.getElementById("zoom-out").addEventListener("click", () => panzoom.zoomOut());
  document.getElementById("reset").addEventListener("click", () => panzoom.reset());
}
</script>
</body>
</html>
