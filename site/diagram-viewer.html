<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual interativo</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f6f8fa;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#viewer {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  cursor: grab;
}
#viewer:active { cursor: grabbing; }
#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
}
#stage svg {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  overflow: visible;
  user-select: none;
  touch-action: none;
}
.controls {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  gap: 6px;
}
.controls button {
  border: 1px solid #687782;
  background: #ffffff;
  color: #1f2933;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
#error {
  display: none;
  padding: 1rem;
  color: #7a271a;
}
</style>
</head>
<body>
<div id="viewer">
  <div class="controls" aria-label="Controles do visual">
    <button type="button" id="zoom-in" aria-label="Ampliar">+</button>
    <button type="button" id="zoom-out" aria-label="Reduzir">−</button>
    <button type="button" id="reset">Restaurar</button>
  </div>
  <div id="stage" aria-live="polite"></div>
  <div id="error">Visual indisponível.</div>
</div>
<script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const requested = params.get("src") || "";
const alt = params.get("alt") || "Visual metodológico interativo";
const allowed = /^assets\/visuais\/V\d{2}\.svg$/;
const stage = document.getElementById("stage");
const error = document.getElementById("error");
const viewer = document.getElementById("viewer");

function fail() {
  stage.style.display = "none";
  error.style.display = "block";
}

async function loadDiagram() {
  if (!allowed.test(requested)) {
    fail();
    return;
  }

  try {
    const response = await fetch(requested, { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const source = await response.text();
    const parsed = new DOMParser().parseFromString(source, "image/svg+xml");
    if (parsed.querySelector("parsererror")) throw new Error("SVG parse error");

    const svg = document.importNode(parsed.documentElement, true);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", alt);

    // Mermaid Live may export the current editor pan/zoom state. That matrix is
    // presentation state, not part of the diagram geometry, so remove it.
    svg.querySelectorAll(".svg-pan-zoom_viewport").forEach((node) => {
      node.removeAttribute("transform");
      if (node.style) node.style.transform = "";
    });

    svg.removeAttribute("width");
    svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.style.width = "100%";
    svg.style.height = "100%";
    svg.style.maxWidth = "none";
    svg.style.overflow = "visible";

    stage.replaceChildren(svg);

    requestAnimationFrame(() => {
      const geometry = svg.querySelector(".svg-pan-zoom_viewport") || svg.querySelector("g") || svg;
      const box = geometry.getBBox();
      if (!(box.width > 0 && box.height > 0)) throw new Error("Empty SVG geometry");

      const pad = Math.max(24, Math.max(box.width, box.height) * 0.035);
      svg.setAttribute(
        "viewBox",
        `${box.x - pad} ${box.y - pad} ${box.width + 2 * pad} ${box.height + 2 * pad}`
      );

      const panzoom = Panzoom(stage, {
        maxScale: 12,
        minScale: 0.5,
        step: 0.3
      });
      viewer.addEventListener("wheel", panzoom.zoomWithWheel, { passive: false });
      document.getElementById("zoom-in").addEventListener("click", () => panzoom.zoomIn());
      document.getElementById("zoom-out").addEventListener("click", () => panzoom.zoomOut());
      document.getElementById("reset").addEventListener("click", () => panzoom.reset());
    });
  } catch (err) {
    console.error("Falha ao carregar visual:", err);
    fail();
  }
}

loadDiagram();
</script>
</body>
</html>
