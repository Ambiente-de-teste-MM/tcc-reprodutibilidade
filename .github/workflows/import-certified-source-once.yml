name: Importar snapshot público certificado (one-shot)

on:
  push:
    branches:
      - release-candidate-2026-10-30
    paths:
      - .github/workflows/import-certified-source-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v6
        with:
          ref: release-candidate-2026-10-30
          fetch-depth: 0

      - name: Baixar e verificar artefato público certificado
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9854-820e-9619-48d6031242e2/raw?se=2026-11-01T20%3A15%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=f833e7be-cd4b-5651-af94-8e490542639e&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T11%3A58%3A29Z&ske=2026-11-02T11%3A58%3A29Z&sks=b&skv=2026-02-06&sig=HZutwRUlzEqJdJQg94LNpSTY0jtvz1GGBMbEKlIBsK8%3D' \
            --output /tmp/public-repository-candidate.zip
          echo '657efaad34668825c00fc8508915a5aa04e05806eb9a347cb98d79e79fa2e11a  /tmp/public-repository-candidate.zip' | sha256sum -c -
          rm -rf /tmp/source
          mkdir /tmp/source
          unzip -q /tmp/public-repository-candidate.zip -d /tmp/source

          # Remove only products generated during integrated CI. The remaining
          # source tree is the certified 42-file publication snapshot.
          rm -rf /tmp/source/reproducibilidade/resultados
          rm -rf /tmp/source/site/.quarto
          rm -rf /tmp/source/site/_extensions
          rm -rf /tmp/source/site/_site

          test -f /tmp/source/README.md
          test -f /tmp/source/reproducibilidade/executar_analise.R
          test -f /tmp/source/reproducibilidade/referencia/ambiente_execucao_referencia.csv
          test -f /tmp/source/site/execucao.qmd
          test -f /tmp/source/.github/workflows/pages.yml
          test ! -e /tmp/source/reproducibilidade/dados/fontes_originais
          test ! -e /tmp/source/reproducibilidade/resultados
          test ! -e /tmp/source/site/_site

      - name: Importar fonte certificada preservando workflows temporariamente
        shell: bash
        run: |
          set -euo pipefail

          # Preserve .git and workflows so this job never rewrites/deletes its
          # own workflow through GITHUB_TOKEN. Workflows are reconciled through
          # the repository connector immediately after this one-shot import.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          if [ -d /tmp/source/.github ]; then
            find /tmp/source/.github -mindepth 1 -maxdepth 1 ! -name workflows -exec cp -a {} .github/ \;
          fi
          find /tmp/source -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import certified public source snapshot'
          git push origin HEAD:release-candidate-2026-10-30

      - name: Confirmar superfícies essenciais importadas
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f reproducibilidade/executar_analise.R
          test -f reproducibilidade/dados/processados/tcc_data_panel-canonical-mercosur_1990-2023_2026-10-21_v01.csv
          test -f reproducibilidade/referencia/ambiente_execucao_referencia.csv
          test -f site/execucao.qmd
          ! find reproducibilidade -path '*/dados/fontes_originais/*' -type f | grep -q .
          ! find reproducibilidade -path '*/dados/extratos_csv/*' -type f | grep -q .
          ! find reproducibilidade -type f -name 'tcc_data_source_*' | grep -q .
