name: Importar snapshot público certificado (one-shot)

on:
  push:
    branches:
      - release-candidate-2026-10-30
    paths:
      - .github/workflows/import-certified-source-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v6
        with:
          ref: release-candidate-2026-10-30
          fetch-depth: 0

      - name: Reconstruir e verificar snapshot certificado
        shell: bash
        run: |
          set -euo pipefail
          cat \
            _import/source.xz.b64.part-00 \
            _import/fixed.part-01 \
            _import/fixed.part-02 \
            _import/fixed.part-03 \
            _import/source.xz.b64.part-04 \
            _import/fixed.part-05 \
            _import/fixed.part-06 \
            _import/fixed.part-07 \
            _import/fixed.part-08 \
            _import/fixed.part-09 \
            > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "106a295aadd180b2bfbea712f78dfe82d64250868466e78f8059b8ea2c50ffe7  /tmp/source.tar.xz" | sha256sum -c -
          rm -rf /tmp/source
          mkdir /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test -f /tmp/source/README.md
          test -f /tmp/source/reproducibilidade/executar_analise.R
          test -f /tmp/source/reproducibilidade/referencia/ambiente_execucao_referencia.csv
          test -f /tmp/source/site/execucao.qmd
          test -f /tmp/source/.github/workflows/pages.yml
          test ! -e /tmp/source/reproducibilidade/dados/fontes_originais
          test ! -e /tmp/source/reproducibilidade/resultados
          test ! -e /tmp/source/site/_site

      - name: Importar fonte certificada preservando workflows temporariamente
        shell: bash
        run: |
          set -euo pipefail

          # Preserve .git and the current workflow directory so the job never
          # attempts to rewrite/delete its own workflow through GITHUB_TOKEN.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          # Replace non-workflow .github content, if any, while preserving workflows.
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          if [ -d /tmp/source/.github ]; then
            find /tmp/source/.github -mindepth 1 -maxdepth 1 ! -name workflows -exec cp -a {} .github/ \;
          fi

          # Copy every certified top-level entry except .github.
          find /tmp/source -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import certified public source snapshot"
          git push origin HEAD:release-candidate-2026-10-30

      - name: Confirmar superfícies essenciais importadas
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f reproducibilidade/executar_analise.R
          test -f reproducibilidade/dados/processados/tcc_data_panel-canonical-mercosur_1990-2023_2026-10-21_v01.csv
          test -f reproducibilidade/referencia/ambiente_execucao_referencia.csv
          test -f site/execucao.qmd
          ! find reproducibilidade -path '*/dados/fontes_originais/*' -type f | grep -q .
          ! find reproducibilidade -path '*/dados/extratos_csv/*' -type f | grep -q .
          ! find reproducibilidade -type f -name 'tcc_data_source_*' | grep -q .
