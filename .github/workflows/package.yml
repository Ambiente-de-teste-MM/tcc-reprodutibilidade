name: Montar pacote de reprodução

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Montar ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path.cwd()
          out = root / "build"
          out.mkdir(exist_ok=True)
          shutil.make_archive(str(out / "tcc_pacote-reprodutibilidade-r"), "zip", root / "reproducibilidade")
          PY
      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: tcc-pacote-reprodutibilidade-r
          path: build/tcc_pacote-reprodutibilidade-r.zip
