name: Testar render Quarto + webR — Pilot 01

on:
  push:
    branches:
      - pilot01-render-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Pilot 01
        uses: actions/checkout@v6

      - name: Recuperar stack webR certificada
        uses: actions/checkout@v6
        with:
          repository: Ambiente-de-teste-MM/tcc-repro-test
          ref: ea595a1cded801c609e2b0a47d64f39e64ddf1b9
          path: .certified-stack

      - name: Instalar R de build
        uses: r-lib/actions/setup-r@v2

      - name: Instalar dependências R de renderização
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown
          install-quarto: false
          cache: false

      - name: Fixar R usado pelo Quarto
        shell: bash
        run: |
          echo "QUARTO_R=$(dirname "$(command -v Rscript)")" >> "$GITHUB_ENV"

      - name: Verificar R de renderização
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          cat("R_LIBS_USER=", Sys.getenv("R_LIBS_USER"), "\n", sep = "")
          print(.libPaths())
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
          print(packageVersion("knitr"))
          print(packageVersion("rmarkdown"))

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar Quarto Live e painel canônico para o Pilot
        run: |
          mkdir -p site/_extensions site/data
          cp -R .certified-stack/_extensions/r-wasm site/_extensions/
          cp .certified-stack/data/tcc_data_panel-canonical-mercosur_1990-2023_2026-10-21_v01.csv site/data/

      - name: Preparar Guia para o site
        run: python scripts/preparar_guia_site.py

      - name: Verificar Quarto
        run: quarto check

      - name: Renderizar site
        run: quarto render site

      - name: Arquivar site renderizado
        uses: actions/upload-artifact@v4
        with:
          name: site-pilot01-webr-render
          path: site/_site
