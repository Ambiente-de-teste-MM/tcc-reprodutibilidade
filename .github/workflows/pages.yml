name: Renderizar site Quarto — Pilot 01

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Preparar Guia para o site
        run: python scripts/preparar_guia_site.py
      - name: Renderizar site
        run: quarto render site
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
