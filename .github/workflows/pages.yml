name: Testar render Quarto — Pilot 01

on:
  push:
    branches:
      - pilot01-render-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Preparar Guia para o site
        run: python scripts/preparar_guia_site.py
      - name: Renderizar site
        run: quarto render site
      - name: Arquivar site renderizado
        uses: actions/upload-artifact@v4
        with:
          name: site-pilot01-render
          path: site/_site
