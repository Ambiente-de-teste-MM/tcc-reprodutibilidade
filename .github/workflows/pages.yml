name: Testar render Quarto + webR — Pilot 01

on:
  push:
    branches:
      - pilot01-render-test
      - pilot01-e1e4-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Pilot 01
        uses: actions/checkout@v6

      - name: Recuperar stack webR certificada
        uses: actions/checkout@v6
        with:
          repository: Ambiente-de-teste-MM/tcc-repro-test
          ref: ea595a1cded801c609e2b0a47d64f39e64ddf1b9
          path: .certified-stack

      - name: Instalar R de build
        uses: r-lib/actions/setup-r@v2

      - name: Instalar dependências R de renderização e validação
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown, any::cointReg
          install-quarto: false
          cache: false

      - name: Fixar R usado pelo Quarto
        shell: bash
        run: |
          echo "QUARTO_R=$(dirname "$(command -v Rscript)")" >> "$GITHUB_ENV"

      - name: Verificar R de renderização
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          cat("R_LIBS_USER=", Sys.getenv("R_LIBS_USER"), "\n", sep = "")
          print(.libPaths())
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
          stopifnot(requireNamespace("cointReg", quietly = TRUE))
          print(packageVersion("knitr"))
          print(packageVersion("rmarkdown"))
          print(packageVersion("cointReg"))

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar Quarto Live e fonte processada do painel no Pilot
        shell: bash
        run: |
          mkdir -p site/_extensions reproducibilidade/dados/processados
          cp -R .certified-stack/_extensions/r-wasm site/_extensions/
          cp .certified-stack/data/tcc_data_panel-canonical-mercosur_1990-2023_2026-10-21_v01.csv \
            reproducibilidade/dados/processados/

      - name: Derivar recurso de dados do site
        run: python scripts/preparar_dados_site.py

      - name: Validar núcleo E1–E4 compartilhado
        shell: Rscript {0}
        run: |
          source("site/recursos/execucao-web/e1-e4-core.R", local = FALSE)
          result <- tcc_web_run_core(
            "site/data/tcc_data_panel-canonical-mercosur_1990-2023_2026-10-21_v01.csv",
            validate = TRUE
          )
          print(result$comparison)
          cat("max_abs_diff=", format(result$max_abs_diff, scientific = TRUE), "\n", sep = "")
          stopifnot(result$max_abs_diff <= 1e-6)

      - name: Preparar Guia para o site
        run: python scripts/preparar_guia_site.py

      - name: Verificar Quarto
        run: quarto check

      - name: Renderizar site
        run: quarto render site

      - name: Arquivar site renderizado
        uses: actions/upload-artifact@v4
        with:
          name: site-pilot01-e1e4-render
          path: site/_site
