name: Assemble corrected Guide v13

on:
  push:
    branches: [guide-v13-sync]
    paths: ['.github/workflows/assemble-guide-v13-sync.yml']

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify Guide
        run: |
          cat tmp/guide-sync/part1.txt tmp/guide-sync/part2.txt tmp/guide-sync/part3.txt > guia/guia-execucao-reprodutibilidade-r.md
          echo 'e11a41f8de7fd9a7796dd06e4c28845d6f66402837de64bb304bb157f7b07818  guia/guia-execucao-reprodutibilidade-r.md' | sha256sum -c -
      - name: Commit clean synchronized tree
        run: |
          rm -rf tmp/guide-sync
          rm .github/workflows/assemble-guide-v13-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize corrected Guide v13 from Drive export"
          git push origin HEAD:guide-v13-sync
          git push origin HEAD:pilot01-e1e4-core
