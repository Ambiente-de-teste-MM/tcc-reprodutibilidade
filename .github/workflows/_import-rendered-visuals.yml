name: One-shot import rendered visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_import-rendered-visuals.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify rendered SVGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/visuais
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1bc0-820e-8a1b-9d43618d5a28/raw?se=2026-11-01T21%3A42%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=039f9078-8a92-5d3f-a747-2c05435a1d08&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T16%3A10%3A29Z&ske=2026-11-02T16%3A10%3A29Z&sks=b&skv=2026-02-06&sig=4WoXD/OicSPNMZVAIPyCR2zPnK%2BFEeI6KUczntEE5%2BU%3D' -o site/assets/visuais/V01.svg
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9a6c-820e-a7a1-c5713c09cee0/raw?se=2026-11-01T21%3A42%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=1084245f-18cb-5cdb-9c05-9142be97b20e&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T00%3A49%3A01Z&ske=2026-11-02T00%3A49%3A01Z&sks=b&skv=2026-02-06&sig=IQg7wKJmiDDs3vCJm%2BMppOZBVqMuk14agfb67iggzqw%3D' -o site/assets/visuais/V02.svg
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6610-820e-844a-bfad2a1d846a/raw?se=2026-11-01T21%3A42%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=7ab824c8-653b-5663-a0b7-4083cb2f1b84&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T00%3A46%3A54Z&ske=2026-11-02T00%3A46%3A54Z&sks=b&skv=2026-02-06&sig=9fwmQ4KFkhVBX13oAPStrZNiiQBiJaFP9jSyPtnd0Vk%3D' -o site/assets/visuais/V04.svg
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0144-820e-9bc8-14fba7e71810/raw?se=2026-11-01T21%3A43%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=33643790-7011-54fe-9a38-d7845668c5a0&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T23%3A52%3A37Z&ske=2026-11-01T23%3A52%3A37Z&sks=b&skv=2026-02-06&sig=%2BCqb%2BRkZxPVxXBtb/to/XzGPA5kCUaEcLJN3cTV0Y6A%3D' -o site/assets/visuais/V05.svg
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-94d8-820e-b0ed-c73fe5bf13a5/raw?se=2026-11-01T21%3A43%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=2b37a69b-d219-5420-9e4e-302984233445&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T00%3A40%3A39Z&ske=2026-11-02T00%3A40%3A39Z&sks=b&skv=2026-02-06&sig=xLQKMgi0oNLasOZ97EqfV3e8KStUX4xaQfB7PTGHO70%3D' -o site/assets/visuais/V06.svg
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f22c-820e-864a-f425b3785200/raw?se=2026-11-01T21%3A43%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=1458ba58-8a36-5932-9ea5-ac3ee26dbac5&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T16%3A10%3A29Z&ske=2026-11-02T16%3A10%3A29Z&sks=b&skv=2026-02-06&sig=VghlP6hVYdzpPDQA4nvmoWBQNMYaqY0Z0HkIQkx8oVM%3D' -o site/assets/visuais/V07.svg
          printf '%s  %s\n' \
            84ae21449e0d9b5072c82c76277bb70ff9e80ccb8a30d91e3d9494478cc69ebe site/assets/visuais/V01.svg \
            e8bdd2a03281aee94641605836cac87b887ae02972ddc6c1c149515f6cc23958 site/assets/visuais/V02.svg \
            026b8c4e07da5bdbf079594358cf07e45d2f132413ea0c0b4ed39e53f6538f1b site/assets/visuais/V04.svg \
            4f0620d1e6c53070397aaa125afa432eaa44a99c315521995a68ebb3a61fdf58 site/assets/visuais/V05.svg \
            edf009fe34ba56737335349b8e0e9f13d948d1959e66827c03fad6d745e3839f site/assets/visuais/V06.svg \
            a6e2f058e15801dcf3ace624a3ecbf32738a60d491f96715108a1fff94a0591a site/assets/visuais/V07.svg | sha256sum -c -
      - name: Commit visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/visuais
          git commit -m "Add rendered Mermaid visuals"
          git push
